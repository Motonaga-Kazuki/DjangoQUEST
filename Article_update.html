{% extends "base/conduit_base.html" %}
{% block body %}

<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <ul class="error-messages">
          <li>That title is required</li>
        </ul>

        <form method="POST">
        {% csrf_token %}
          <fieldset>
            <fieldset class="form-group">
              <input type="text" name="title" 
              class="form-control form-control-lg" placeholder="Article Title" 
              value="{{ form.title.value|default:'' }}"/>
            </fieldset>

            <fieldset class="form-group">
              <input type="text" name="description" 
              class="form-control" placeholder="What's this article about?" 
              value="{{ form.description.value|default:'' }}"/>
            </fieldset>

            <fieldset class="form-group">
              <textarea
                name="body"
                class="form-control"
                rows="8"
                >{{ form.body.value|default:'' }}"</textarea>
            </fieldset>

            {#タグ#}
            <fieldset class="form-group">
              <input type="text" name="tags_input" 
              class="form-control" placeholder="Enter tags(separate with commas)" 
              value="{{ form.tags_input.value|default:'' }}"/>
              <div class="tag-list">
                <span class="tag-default tag-pill"> <i class="ion-close-round"></i> tag </span>
              </div>
            </fieldset>

            <button class="btn btn-lg pull-xs-right btn-primary" type="submit">
              Publish Article
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>


{% endblock %}
